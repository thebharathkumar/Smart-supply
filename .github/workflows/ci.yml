name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm -r typecheck
      - run: pnpm -r build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ml-forecast, ml-optimize, ml-agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r services/${{ matrix.service }}/requirements.txt
      - run: pip install ruff mypy
      - run: ruff check services/${{ matrix.service }}
      - run: python -m py_compile $(find services/${{ matrix.service }}/app -name '*.py')

  docker:
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate compose
        run: docker compose -f infra/docker-compose.yml config -q
