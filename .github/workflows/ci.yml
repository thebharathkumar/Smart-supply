name: CI

on:
  push:
    branches: [main, "claude/**", "feat/**"]
  pull_request:
    branches: [main]

# Don't cancel sibling matrix jobs when one fails - we want to see every error.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.12.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          # No cache: pnpm - we don't ship a lockfile in this branch.
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm -r build

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ml-forecast, ml-optimize, ml-agent]
    env:
      OTEL_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      # Heavy ML deps for ml-forecast pull cmdstanpy which builds C++ - skip
      # those installs in CI; we only need the syntax/lint check to pass.
      - name: Install lint deps
        run: pip install ruff==0.7.4 mypy==1.13.0
      - name: Install service runtime deps (best-effort)
        run: pip install -r services/${{ matrix.service }}/requirements.txt || echo "deps install partial; continuing"
      - name: Ruff
        run: ruff check services/${{ matrix.service }}
      - name: Syntax compile
        run: |
          set -e
          for f in $(find services/${{ matrix.service }}/app -name '*.py'); do
            python -m py_compile "$f"
          done

  docker:
    runs-on: ubuntu-latest
    needs: [node, python]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validate base compose
        run: docker compose -f infra/docker-compose.yml config -q
      - name: Validate observability overlay
        run: docker compose -f infra/docker-compose.yml -f infra/docker-compose.observability.yml config -q
