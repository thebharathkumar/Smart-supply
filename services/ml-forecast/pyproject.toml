[project]
name = "smart-supply-ml-forecast"
version = "0.1.0"
description = "Time-series forecasting service for supplier emissions"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "prophet>=1.1.6",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
