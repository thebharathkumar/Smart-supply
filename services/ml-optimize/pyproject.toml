[project]
name = "smart-supply-ml-optimize"
version = "0.1.0"
description = "Multi-objective route optimization service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    "structlog>=24.4.0",
    "prometheus-client>=0.21.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
