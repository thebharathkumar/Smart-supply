# Dev stack for Smart Supply.
# Brings up data layer + all application services.
# For observability stack, also include docker-compose.observability.yml.
name: smart-supply

services:
  # ---------- Data layer ----------
  postgres:
    # TimescaleDB image is built on Postgres 16 and we add pgvector via init.
    image: timescale/timescaledb-ha:pg16
    container_name: smart-supply-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smartsupply}
      POSTGRES_USER: ${POSTGRES_USER:-smartsupply}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: smart-supply-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka-compatible, lighter for dev.
    image: redpandadata/redpanda:v24.2.4
    container_name: smart-supply-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
    ports:
      - "19092:19092"  # Kafka
      - "8081:8081"    # Schema Registry (Confluent-compatible HTTP API)
      - "9644:9644"    # Admin
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true'"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- Application layer ----------
  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    container_name: smart-supply-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-smartsupply}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-smartsupply}
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      BACKEND_PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      ML_FORECAST_URL: http://ml-forecast:8001
      ML_OPTIMIZE_URL: http://ml-optimize:8002
      ML_AGENT_URL: http://ml-agent:8003
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_SERVICE_NAME: smart-supply-backend
      OTEL_DISABLED: ${OTEL_DISABLED:-true}
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  simulator:
    build:
      context: ..
      dockerfile: apps/simulator/Dockerfile
    container_name: smart-supply-simulator
    restart: unless-stopped
    depends_on:
      redpanda: { condition: service_healthy }
      backend: { condition: service_healthy }
    environment:
      KAFKA_BROKERS: redpanda:9092
      SCHEMA_REGISTRY_URL: http://redpanda:8081
      SIM_EVENTS_PER_SEC: ${SIM_EVENTS_PER_SEC:-200}
      SIM_SHIPMENTS: ${SIM_SHIPMENTS:-50}
      DATABASE_URL: postgres://${POSTGRES_USER:-smartsupply}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-smartsupply}

  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:4000/ws}
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
    container_name: smart-supply-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  ml-forecast:
    build:
      context: ../services/ml-forecast
      dockerfile: Dockerfile
    container_name: smart-supply-ml-forecast
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartsupply}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-smartsupply}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_DISABLED: ${OTEL_DISABLED:-true}
      PORT: 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  ml-optimize:
    build:
      context: ../services/ml-optimize
      dockerfile: Dockerfile
    container_name: smart-supply-ml-optimize
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smartsupply}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-smartsupply}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_DISABLED: ${OTEL_DISABLED:-true}
      PORT: 8002
    ports:
      - "8002:8002"

  ml-agent:
    build:
      context: ../services/ml-agent
      dockerfile: Dockerfile
    container_name: smart-supply-ml-agent
    restart: unless-stopped
    depends_on:
      ml-forecast: { condition: service_started }
      ml-optimize: { condition: service_started }
    environment:
      ML_FORECAST_URL: http://ml-forecast:8001
      ML_OPTIMIZE_URL: http://ml-optimize:8002
      DATABASE_URL: postgres://${POSTGRES_USER:-smartsupply}:${POSTGRES_PASSWORD:-changeme_dev_only}@postgres:5432/${POSTGRES_DB:-smartsupply}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      OTEL_DISABLED: ${OTEL_DISABLED:-true}
      PORT: 8003
    ports:
      - "8003:8003"

volumes:
  pgdata:
  redisdata:
