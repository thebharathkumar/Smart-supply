{{- /*
  Default-deny + targeted allow rules.
  - frontend: receive from ingress only
  - backend: receive from frontend pods + ingress; egress to ML services + DB + Redis + Kafka
  - ML services: receive from backend + agent; egress to DB
*/ -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-frontend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-supply
      app.kubernetes.io/component: frontend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-allow-backend
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: smart-supply
      app.kubernetes.io/component: backend
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-supply
              app.kubernetes.io/component: frontend
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: smart-supply
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: data } } }]
      ports:
        - { protocol: TCP, port: 5432 }   # postgres
        - { protocol: TCP, port: 6379 }   # redis
        - { protocol: TCP, port: 9092 }   # kafka
    # Allow DNS resolution.
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }]
