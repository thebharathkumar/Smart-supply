{{- /*
  Pre-install / pre-upgrade migration job.
  Runs `pnpm db migrate` against the configured database before any
  service rollout. Uses helm hooks so it blocks the release.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
    "helm.sh/hook-weight": "0"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: {{ include "smart-supply.image" (dict "Values" .Values "repository" "smart-supply-backend") }}
          command: ["node"]
          args: ["/repo/packages/db/dist/migrate.js"]
          env:
            {{- include "smart-supply.commonEnv" . | nindent 12 }}
