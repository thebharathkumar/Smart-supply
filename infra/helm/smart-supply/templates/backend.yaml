apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "smart-supply.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "smart-supply.componentSelector" (dict "Release" .Release "Values" .Values "component" "backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "smart-supply.componentSelector" (dict "Release" .Release "Values" .Values "component" "backend") | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          image: {{ include "smart-supply.image" (dict "Values" .Values "repository" .Values.backend.image.repository) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - { name: http, containerPort: 4000 }
          env:
            {{- include "smart-supply.commonEnv" . | nindent 12 }}
            - name: BACKEND_PORT
              value: "4000"
            - name: ML_FORECAST_URL
              value: http://{{ .Release.Name }}-ml-forecast:{{ .Values.mlForecast.service.port }}
            - name: ML_OPTIMIZE_URL
              value: http://{{ .Release.Name }}-ml-optimize:{{ .Values.mlOptimize.service.port }}
            - name: ML_AGENT_URL
              value: http://{{ .Release.Name }}-ml-agent:{{ .Values.mlAgent.service.port }}
            - name: LOG_LEVEL
              value: {{ .Values.backend.env.LOG_LEVEL | quote }}
            - name: OTEL_SERVICE_NAME
              value: smart-supply-backend
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend
  labels:
    {{- include "smart-supply.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.backend.service.type }}
  selector:
    {{- include "smart-supply.componentSelector" (dict "Release" .Release "Values" .Values "component" "backend") | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.backend.service.port }}, targetPort: http }
{{- if .Values.backend.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .Release.Name }}-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Release.Name }}-backend
  minReplicas: {{ .Values.backend.hpa.minReplicas }}
  maxReplicas: {{ .Values.backend.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.backend.hpa.targetCPUUtilizationPercentage }}
{{- end }}
