{{- if .Values.observability.serviceMonitor.enabled }}
{{- range $svc := list "backend" "ml-forecast" "ml-optimize" "ml-agent" }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $.Release.Name }}-{{ $svc }}
  namespace: {{ $.Values.observability.serviceMonitor.namespace }}
  labels:
    {{- with $.Values.observability.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [ {{ $.Release.Namespace | quote }} ]
  selector:
    matchLabels:
      app.kubernetes.io/name: smart-supply
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $svc }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- end }}
