# Production overlay: full replicas, simulator off, HPA on.
global:
  domain: smart-supply.example.com

backend:
  replicaCount: 3
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 20

frontend:
  replicaCount: 3

simulator:
  enabled: false

mlForecast:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 12

mlOptimize:
  replicaCount: 2
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8

mlAgent:
  replicaCount: 2
